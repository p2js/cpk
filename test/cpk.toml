target_dir = "build" # Directory for all targets' builds

[dependencies] # dependencies map names to repositories/files

# Add your own here, manually or via cpk add...

[targets]
# targets map target names to build commands (for use with cpk run/compile)
# all files produced by the build command will be output to target_dir/target_name

# dev is the default profile (will be used by run/compile when a target is not provided)
dev = {
  build = "clang src/main.c", # Build command
  ex = "a.out" # Executable path to be used by cpk run (in target dir), default: "a.out"
}
