target_dir = "build"

[dependencies]
miniz = "zip:https://github.com/richgel999/miniz/releases/download/3.1.0/miniz-3.1.0.zip"
tomlc17 = "git:https://github.com/cktan/tomlc17.git"
xxHash = "git:https://github.com/Cyan4973/xxHash.git"

[targets]

dev = {
    build = "clang src/main.c -I.cpk -o cpk",
    ex = "cpk"
}

release = {
    build = "clang src/main.c -O3 -I.cpk -o cpk",
    ex = "cpk"
}

static-musl = {
    build = "musl-gcc -static -O3 -I.cpk -o cpk",
    ex = "cpk"
}
